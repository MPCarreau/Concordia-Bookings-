<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Concordia Student Services - Forgot Password</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        
        <link rel="stylesheet" href="static/style.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        
        <script>
            
            // Update navigation when page loads
            window.addEventListener('DOMContentLoaded', function() {
                document.getElementById('forgotPasswordForm').addEventListener('submit', handleForgotPassword);
            });
        
            async function handleForgotPassword(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                
                const email = formData.get('email');

                // Basic validation
                if (!email) {
                    showMessage('Please enter your email address.', 'error');
                    return;
                }

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.', 'error');
                    return;
                }

                // Show loading state
                const submitButton = form.querySelector('button[type="submit"]');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Sending...';
                submitButton.disabled = true;

                try {
                    const response = await fetch('https://soen287project4-production.up.railway.app/api/forgot-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage('Reset link sent! Please check your email for password reset instructions.', 'success');
                        form.reset();
                    } else {
                        showMessage(result.error || 'User not found. Please check your email address.', 'error');
                    }
                } catch (error) {
                    console.error('Forgot password error:', error);
                    showMessage('Network error. Please check your connection and try again.', 'error');
                } finally {
                    // Reset button state
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            }

            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function showMessage(message, type) {
                // Remove existing messages
                const existingMessage = document.querySelector('.forgot-password-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                // Create new message element
                const messageDiv = document.createElement('div');
                messageDiv.className = `forgot-password-message ${type}`;
                messageDiv.textContent = message;

                // Insert message after the form
                const form = document.querySelector('.login_form');
                form.parentNode.insertBefore(messageDiv, form.nextSibling);

                // Auto-remove success messages after 5 seconds
                if (type === 'success') {
                    setTimeout(() => {
                        if (messageDiv.parentNode) {
                            messageDiv.remove();
                        }
                    }, 5000);
                }
            }

            // Add event listener when page loads
            window.addEventListener('DOMContentLoaded', function() {
                document.getElementById('forgotPasswordForm').addEventListener('submit', handleForgotPassword);
            });
        </script>

        <div class="content">

            <form id="forgotPasswordForm" method="post" class="login_form">
                <h3>Reset Password</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 20px; text-align: center;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <div>
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="button-container" style="text-align: center; margin: 20px 0;">
                    <button type="submit" style="width: 200px; padding: 12px 20px;">Send Reset Link</button>
