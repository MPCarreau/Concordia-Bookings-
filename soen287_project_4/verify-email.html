<!DOCTYPE html>

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        
        <script>
            async function verifyEmail() {
                // Get verification token from URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                const email = urlParams.get('email');

                if (!token || !email) {
                    showVerificationResult('Invalid verification link. Please check your email for the correct link.', 'error');
                    return;
                }

                // Show loading message
                showVerificationResult('Verifying your account...', 'loading');

                try {
                    const response = await fetch('https://soen287project4-production.up.railway.app/api/verify-email', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            token: token,
                            email: email
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showVerificationResult(
                            `Account verified successfully! Welcome to Concordia Student Services, ${result.user?.firstName || 'Student'}!`, 
                            'success'
                        );
                        
                        // Redirect to login page after 3 seconds
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);
                    } else {
                        let errorMessage = 'Email verification failed. ';
                        
                        if (result.error && result.error.includes('expired')) {
                            errorMessage += 'This verification link has expired. Please register again.';
                        } else if (result.error && result.error.includes('invalid')) {
                            errorMessage += 'This verification link is invalid. Please check your email for the correct link.';
                        } else if (result.error && result.error.includes('already verified')) {
                            errorMessage += 'This account has already been verified. You can log in now.';
                        } else {
                            errorMessage += result.error || 'Please try again or contact support.';
                        }
                        
                        showVerificationResult(errorMessage, 'error');
                    }
                } catch (error) {
                    console.error('Verification error:', error);
                    showVerificationResult('Network error. Please check your connection and try again.', 'error');
                }
            }

            function showVerificationResult(message, type) {
                const resultDiv = document.getElementById('verificationResult');
                resultDiv.className = `verification-result ${type}`;
                resultDiv.innerHTML = message;
                
                if (type === 'success') {
                    // Add login link for successful verification
                    resultDiv.innerHTML += '<br><br><a href="login.html" class="login-link">Continue to Login</a>';
                } else if (type === 'error') {
                    // Add helpful links for errors
                    resultDiv.innerHTML += '<br><br><a href="register.html" class="register-link">Try Registration Again</a> | <a href="login.html" class="login-link">Go to Login</a>';
                }
            }

            // Run verification when page loads
            window.addEventListener('DOMContentLoaded', verifyEmail);
        </script>
