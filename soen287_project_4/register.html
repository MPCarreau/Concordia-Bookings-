        <script>
            function togglePassword(fieldId) {
                const passwordField = document.getElementById(fieldId);
                const toggleButton = passwordField.nextElementSibling;
                
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    toggleButton.textContent = 'Hide';
                } else {
                    passwordField.type = 'password';
                    toggleButton.textContent = 'Show';
                }
            }

            function validatePasswords() {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const errorMessage = document.getElementById('password-error');
                
                if (confirmPassword === '') {
                    errorMessage.textContent = '';
                    errorMessage.style.display = 'none';
                    return;
                }
                
                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords above do not match!';
                    errorMessage.style.display = 'block';
                } else {
                    errorMessage.textContent = '';
                    errorMessage.style.display = 'none';
                }
            }

            async function handleRegistration(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                
                const registrationData = {
                    firstName: formData.get('firstName'),
                    lastName: formData.get('lastName'),
                    email: formData.get('email'),
                    phoneNumber: formData.get('phoneNumber'),
                    password: formData.get('password'),
                    confirmPassword: formData.get('confirmPassword'),
                    role: formData.get('role')
                };

                // check email requirements
                const emailPatterns = ['live\\.concordia\\.ca', 'mail\\.concordia\\.ca', 'encs\\.concordia\\.ca', 'cse\\.concordia\\.ca'];
                const emailRegex = new RegExp(`@(${emailPatterns.join('|')})$`, 'i'); 
                if (!emailRegex.test(registrationData.email)) {
                    showMessage('Email must be a Concordia domain (\'@live.concordia.ca\', \'@mail.concordia.ca\', \'@encs.concordia.ca\', \'@cse.concordia.ca\').', 'error');
                    return;
                }

                // Client-side validation
                if (registrationData.password !== registrationData.confirmPassword) {
                    showMessage('Passwords do not match!', 'error');
                    return;
                }

                // check password requirements
                const num = /[0-9]/;
                const sym = /[#?!@$%^&*-]/;
                if (registrationData.password.length < 8 || !num.test(registrationData.password) ||  !sym.test(registrationData.password)) {
                    showMessage('Password must containt at least 8 characters, one number, and one special character.', 'error');
                    return;
                }

                // Show loading state
                const submitButton = form.querySelector('button[type="submit"]');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Creating Account...';
                submitButton.disabled = true;

                try {
                    const response = await fetch('https://soen287project4-production.up.railway.app/api/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            ...registrationData,
                            requireEmailVerification: true
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Show verification email sent message
                        const successMessage = 'Verification Email sent! Please check your mailbox and confirm your account to access Concordia Resources.';
                        showMessage(successMessage, 'success');
                        
                        // Clear the form
                        form.reset();
                        
                        // Hide the form after successful registration
                        setTimeout(() => {
                            form.style.display = 'none';
                            
                            // Create additional instructions
                            const instructionsDiv = document.createElement('div');
                            instructionsDiv.className = 'verification-instructions';
                            instructionsDiv.innerHTML = `
                                <h3>Check Your Email</h3>
                                <p>We've sent a verification link to <strong>${registrationData.email}</strong></p>
                                <p>Click the link in the email to activate your account and start using Concordia Student Services.</p>
                                <p><small>Didn't receive the email? Check your spam folder or <a href="register.html" style="color: var(--red); text-decoration: underline;">try again</a>.</small></p>
                            `;
                            
                            const contentDiv = document.querySelector('.content');
                            contentDiv.appendChild(instructionsDiv);
                        }, 2000);
                        
                    } else {
                        // Handle specific error cases for existing accounts
                        if (result.error && result.error.includes('phone number')) {
                            const errorMessage = 'Phone number already associated with an account, try to <a href="login.html" style="color: #802f2f; text-decoration: underline;">Log in</a> or use <a href="forgot-password.html" style="color: #802f2f; text-decoration: underline;">Forgot Password</a> to retrieve your account.';
                            showMessage(errorMessage, 'error', true);
                        } else if (result.error && result.error.includes('email')) {
                            const errorMessage = 'Email address already associated with an account, try to <a href="login.html" style="color: #802f2f; text-decoration: underline;">Log in</a> or use <a href="forgot-password.html" style="color: #802f2f; text-decoration: underline;">Forgot Password</a> to retrieve your account.';
                            showMessage(errorMessage, 'error', true);
                        } else if (result.error && (result.error.includes('already exists') || result.error.includes('already registered'))) {
                            const errorMessage = 'Account already exists with this information, try to <a href="login.html" style="color: #802f2f; text-decoration: underline;">Log in</a> or use <a href="forgot-password.html" style="color: #802f2f; text-decoration: underline;">Forgot Password</a> to retrieve your account.';
                            showMessage(errorMessage, 'error', true);
                        } else {
                            showMessage(result.error || 'Registration failed. Please try again.', 'error');
                        }
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    showMessage('Network error. Please check your connection and try again.', 'error');
                } finally {
                    // Reset button state
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            }

            function showMessage(message, type, includeLinks = false) {
                // Remove existing messages
                const existingMessage = document.querySelector('.registration-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                // Create new message element
                const messageDiv = document.createElement('div');
                messageDiv.className = `registration-message ${type}`;
                
                if (includeLinks) {
                    messageDiv.innerHTML = message;
                } else {
                    messageDiv.textContent = message;
                }

                // Insert message after the form
                const form = document.querySelector('.login_form');
                form.parentNode.insertBefore(messageDiv, form.nextSibling);

                // Auto-remove success messages after 5 seconds
                if (type === 'success') {
                    setTimeout(() => {
                        if (messageDiv.parentNode) {
                            messageDiv.remove();
                        }
                    }, 5000);
                }
            }

            // Add event listeners when page loads
            window.addEventListener('DOMContentLoaded', function() {
                document.getElementById('password').addEventListener('input', validatePasswords);
                document.getElementById('confirmPassword').addEventListener('input', validatePasswords);
                document.getElementById('registrationForm').addEventListener('submit', handleRegistration);
            });
        </script>

        <script>
        window.addEventListener('DOMContentLoaded', function() {
            const session = localStorage.getItem('userSession') || localStorage.getItem('adminSession');
            document.querySelectorAll('.auth-only').forEach(function(link) {
                link.style.display = session ? '' : 'none';
            });
        });

        <div class="content">

            <form id="registrationForm" method="post" class="login_form">
                <h3>Register</h3>

                <div>
                    <label>First Name</label>
                    <input type="text" name="firstName" placeholder="Enter First Name" required>
                </div>

                <div>
                    <label>Last Name</label>
                    <input type="text" name="lastName" placeholder="Enter Last Name" required>
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter Email Address" required>
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="tel" name="phoneNumber" placeholder="Enter Phone Number" required>
                </div>

                <div class="password-field">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Enter Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">Show</button>
                    </div>
                </div>

                <div class="password-field">
                    <label>Confirm Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">Show</button>
                    </div>
                    <div id="password-error" class="error-message"></div>
                </div>

                <div class="role-field">
                    <label>Are you a Student or Staff member?</label>
                    <div>
                        <input type="radio" id="role" name="role" value="student" required>
                        Student
                        <br>
                        <input type="radio" id="role" name="role" value="staff">
                        Staff
                    </div>
                </div>

                <button type="submit">Register</button>
            </form>

        </div>
