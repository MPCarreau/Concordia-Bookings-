<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Concordia Student Services - Reset Password</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        
        <link rel="stylesheet" href="static/style.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        
        <script>
            
            // Update navigation when page loads
            window.addEventListener('DOMContentLoaded', function() {
                checkTokenValidity();
                document.getElementById('password').addEventListener('input', validatePasswords);
                document.getElementById('confirmPassword').addEventListener('input', validatePasswords);
                document.getElementById('resetForm').addEventListener('submit', handlePasswordReset);
            });
        
            function togglePassword(fieldId) {
                const passwordField = document.getElementById(fieldId);
                const toggleButton = passwordField.nextElementSibling;
                
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    toggleButton.textContent = 'Hide';
                } else {
                    passwordField.type = 'password';
                    toggleButton.textContent = 'Show';
                }
            }

            function validatePasswords() {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const errorMessage = document.getElementById('password-error');
                
                if (confirmPassword === '') {
                    errorMessage.textContent = '';
                    errorMessage.style.display = 'none';
                    return;
                }
                
                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords above do not match!';
                    errorMessage.style.display = 'block';
                } else {
                    errorMessage.textContent = '';
                    errorMessage.style.display = 'none';
                }
            }

            async function handlePasswordReset(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                
                const password = formData.get('password');
                const confirmPassword = formData.get('confirmPassword');
                const token = getTokenFromURL();

                if (!token) {
                    showMessage('Invalid or missing reset token. Please request a new password reset.', 'error');
                    return;
                }

                // Client-side validation
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match!', 'error');
                    return;
                }

                // check password requirements
                const num = /[0-9]/;
                const sym = /[#?!@$%^&*-]/;
                if (password.length < 8 || !num.test(password) ||  !sym.test(password)) {
                    showMessage('Password must containt at least 8 characters, one number, and one special character.', 'error');
                    return;
                }

                if (password.length < 6) {
                    showMessage('hi must be at least 6 characters long.', 'error');
                    return;
                }

                // Show loading state
                const submitButton = form.querySelector('button[type="submit"]');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Resetting...';
                submitButton.disabled = true;

                try {
                    const response = await fetch('https://soen287project4-production.up.railway.app/api/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            token,
                            password,
                            confirmPassword
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showMessage('Password reset successful! You can now login with your new password.', 'success');
                        form.reset();
                        // Redirect to login page after 3 seconds
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);
                    } else {
                        showMessage(result.error || 'Password reset failed. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Password reset error:', error);
                    showMessage('Network error. Please check your connection and try again.', 'error');
                } finally {
                    // Reset button state
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            }

            function getTokenFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('token');
            }

            function showMessage(message, type) {
                // Remove existing messages
                const existingMessage = document.querySelector('.reset-password-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                // Create new message element
                const messageDiv = document.createElement('div');
                messageDiv.className = `reset-password-message ${type}`;
                messageDiv.textContent = message;

                // Insert message after the form
                const form = document.querySelector('.login_form');
                form.parentNode.insertBefore(messageDiv, form.nextSibling);
            }

            function checkTokenValidity() {
                const token = getTokenFromURL();
                if (!token) {
                    showMessage('Invalid or missing reset token. Please request a new password reset.', 'error');
                    document.getElementById('resetForm').style.display = 'none';
                }
            }

            // Add event listener when page loads
            window.addEventListener('DOMContentLoaded', function() {
                checkTokenValidity();
                document.getElementById('password').addEventListener('input', validatePasswords);
                document.getElementById('confirmPassword').addEventListener('input', validatePasswords);
                document.getElementById('resetForm').addEventListener('submit', handlePasswordReset);
            });
        </script>
        <script type="text/javascript" src="backend/scripts.js"></script>
        <script type="text/javascript" src="darkmode.js" defer></script>
        <script type="text/javascript" src="src/profile-dropdown-component.js" defer></script>
    </head>
    <body>
        
        <header>
            <h1>Concordia Student Services</h1>
            
            <!-- Dark Mode Button -->
            <button id="theme-switch">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
            </button>
        </header>

        <nav>
            <a href="index.html">Home</a> |
            <a href="profile.html">Profile</a> |
            <a href="resources.html">Resources</a> |
            <a href="bookings.html">Bookings</a> 
        </nav>

        <div class="content">

            <form id="resetForm" method="post" class="login_form">
                <h3>Set New Password</h3>
                <p style="font-size: 14px; color: #666; margin-bottom: 20px; text-align: center;">
                    Enter your new password below.
                </p>

                <div class="password-field">
                    <label>New Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Enter New Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">Show</button>
                    </div>
                </div>

                <div class="password-field">
                    <label>Confirm New Password</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm New Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">Show</button>
                    </div>
                    <div id="password-error" class="error-message"></div>
                </div>

                <div class="button-container" style="text-align: center; margin: 20px 0;">
                    <button type="submit">Reset Password</button>
                </div>
                
                <div class="forgot-password-section">
                    <a href="login.html" class="forgot-password-link">Back to Login</a>
                </div>
            </form>

        </div>

        <footer>
            <p>Contact Us:</p>
            <ul class="contact_list">
                <li>514-848-2424</li>
                <li>csshelp@concordia.ca</li>
                <li>1455 De Maisonneuve Blvd. W. Montreal</li>
            </ul>

            <p>&copy Team SOEN 2025</p>
        </footer>
        
    </body>

</html>
