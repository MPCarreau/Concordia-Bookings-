<!DOCTYPE html>
<html lang="en">
<head>
    <title>Booking Requests</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
    <script type="text/javascript" src="darkmode.js" defer></script>
    <script type="text/javascript" src="src/profile-dropdown-component.js" defer></script>
    <script>
        let isAdmin = false;
        let user = null;
        let approvalMode = false;

        function checkAuthentication() {
            const userSession = localStorage.getItem('userSession');
            const adminSession = localStorage.getItem('adminSession');
            if (adminSession) {
                try {
                    user = JSON.parse(adminSession);
                    isAdmin = true;
                } catch (e) {}
            } else if (userSession) {
                try {
                    user = JSON.parse(userSession);
                    isAdmin = !!user.isAdmin;
                } catch (e) {}
            }
        }

        function applyAdminVisibility() {
            document.querySelectorAll('.admin-only').forEach(function(el) {
                el.style.display = isAdmin ? '' : 'none';
            });
        }

        async function fetchApprovalMode() {
            // Fetch approval mode from backend
            const resp = await fetch('https://soen287project4-production.up.railway.app/api/booking-approval-mode');
            const data = await resp.json();
            approvalMode = !!data.enabled;
            document.getElementById('approvalModeCheckbox').checked = approvalMode;
        }

        async function setApprovalMode(enabled) {
            await fetch('https://soen287project4-production.up.railway.app/api/booking-approval-mode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            });
            approvalMode = enabled;
        }

        async function fetchRequests() {
            let url = isAdmin ? 'https://soen287project4-production.up.railway.app/api/pending-booking-requests' : `https://soen287project4-production.up.railway.app/api/user-pending-booking-requests?userId=${user.userId}`;
            const resp = await fetch(url);
            const data = await resp.json();
            renderRequests(data.requests || []);
        }

        async function handleApprove(id) {
            await fetch('https://soen287project4-production.up.railway.app/api/approve-booking-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchRequests();
        }

        async function handleReject(id) {
            await fetch('https://soen287project4-production.up.railway.app/api/reject-booking-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchRequests();
        }

        function renderRequests(requests) {
            const container = document.getElementById('requestsContainer');
            if (requests.length === 0) {
                container.innerHTML = '<p>No pending booking requests.</p>';
                return;
            }
            let html = '<table class="requests-table"><thead><tr>';
            html += '<th>Resource</th><th>Date</th><th>Time</th><th>Purpose</th>';
            if (isAdmin) html += '<th>User</th>';
            html += '<th>Status</th>';
            if (isAdmin) html += '<th>Actions</th>';
            html += '</tr></thead><tbody>';
            for (const req of requests) {
                // Backend returns snake_case properties
                const resourceName = req.resource_name || req.resourceName || 'N/A';
                const bookingDate = req.booking_date || req.date || 'N/A';
                const timeSlot = req.time_slot || req.timeSlot || 'N/A';
                const purpose = req.booking_purpose || req.purpose || 'N/A';
                const userEmail = req.email || req.userEmail || '';
                const userName = req.first_name && req.last_name ? `${req.first_name} ${req.last_name}` : userEmail;

                html += `<tr><td>${resourceName}</td><td>${bookingDate}</td><td>${timeSlot}</td><td>${purpose}</td>`;
                if (isAdmin) {
                    html += `<td>${userName}</td>`;
                }
                html += `<td>${req.status}</td>`;
                if (isAdmin) {
                    html += `<td><button onclick="handleApprove(${req.id})">Approve</button> <button onclick="handleReject(${req.id})">Reject</button></td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', async function() {
            checkAuthentication();
            applyAdminVisibility();
            if (isAdmin) {
                const adminControls = document.getElementById('adminControls');
                if (adminControls) adminControls.style.display = '';
                await fetchApprovalMode();
            }
            await fetchRequests();
        });
    </script>
    <style>
        body, html, * {
            font-family: 'Poppins', sans-serif !important;
        }
        .requests-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .requests-table th, .requests-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .requests-table th { background: #f5f5f5; }
        .requests-table button { padding: 6px 14px; margin: 0 2px; border-radius: 4px; border: none; cursor: pointer; }
        .requests-table button:hover { background: #007cba; color: white; }
    </style>
</head>
