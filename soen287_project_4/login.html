        <script>
            
            function togglePassword(fieldId) {
                const passwordField = document.getElementById(fieldId);
                const toggleButton = passwordField.nextElementSibling;
                
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    toggleButton.textContent = 'Hide';
                } else {
                    passwordField.type = 'password';
                    toggleButton.textContent = 'Show';
                }
            }
            
            // Update navigation when page loads
            window.addEventListener('DOMContentLoaded', function() {
                const loginForm = document.getElementById('loginForm');
                if (loginForm) {
                    loginForm.addEventListener('submit', handleLogin);
                } else {
                    // no form found
                }
            });
        
            async function handleLogin(event) {
                event.preventDefault();
                
                const form = event.target;
                const formData = new FormData(form);
                
                const loginData = {
                    email: formData.get('email'),
                    password: formData.get('password')
                };

                // Basic validation
                if (!loginData.email || !loginData.password) {
                    showMessage('Please enter both email and password.', 'error');
                    return;
                }

                // Show loading state
                const submitButton = form.querySelector('button[type="submit"]');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Logging in...';
                submitButton.disabled = true;

                try {
                    const loginUrl = 'https://soen287project4-production.up.railway.app/api/login';
                    const response = await fetch(loginUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(loginData)
                    });
                    const result = await response.json();
                    

                    if (result.success) {
                        showMessage('Login successful! Redirecting...', 'success');

                        // Start with user data from API
                        const session = {
                            userId: result.user.id,
                            email: result.user.email,
                            firstName: result.user.firstName,
                            lastName: result.user.lastName,
                            phoneNumber: result.user.phoneNumber,
                            role: result.user.role,
                            isAdmin: result.user.isAdmin,
                            loginTime: new Date().toISOString()
                        };

                        // Fallback to previous session values if present
                        try {
                            const prev = JSON.parse(localStorage.getItem('userSession') || 'null');
                            if (session.role === undefined && prev?.role !== undefined) session.role = prev.role;
                            if (session.isAdmin === undefined && prev?.isAdmin !== undefined) session.isAdmin = prev.isAdmin;
                        } catch(_) {}

                        // Backfill role/isAdmin from backend if missing
                        if (session.role === undefined || session.isAdmin === undefined) {
                            try {
                                const roleResp = await fetch('https://soen287project4-production.up.railway.app/api/user-role?email=' + encodeURIComponent(session.email));
                                if (roleResp.ok) {
                                    const roleData = await roleResp.json();
                                    if (roleData?.success) {
                                        session.role = roleData.role;
                                        session.isAdmin = !!roleData.isAdmin;
                                    }
                                }
                            } catch (e) {
                                // ignore backfill errors; fallbacks already applied
                            }
                        }

                        // Persist finalized session
                        localStorage.setItem('userSession', JSON.stringify(session));

                        // Redirect to profile page after successful login
                        setTimeout(() => {
                            window.location.href = 'profile.html';
                        }, 1500);
                    } else {
                        showMessage(result.error || 'Login failed. Please check your credentials.', 'error');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showMessage('Network error. Please check your connection and try again.', 'error');
                } finally {
                    // Reset button state
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            }

            function showMessage(message, type) {
                // Remove existing messages
                const existingMessage = document.querySelector('.login-message');
                if (existingMessage) {
                    existingMessage.remove();
                }

                // Create new message element
                const messageDiv = document.createElement('div');
                messageDiv.className = `login-message ${type}`;
                messageDiv.textContent = message;

                // Insert message after the form
                const form = document.querySelector('.login_form');
                form.parentNode.insertBefore(messageDiv, form.nextSibling);

                // Auto-remove success messages after 3 seconds
                if (type === 'success') {
                    setTimeout(() => {
                        if (messageDiv.parentNode) {
                            messageDiv.remove();
                        }
                    }, 3000);
                }
            }

        </script>
